server:
  port: 8085

spring:
  application:
    name: vibespace-backend
  datasource:
    # MySQL Database Connection
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vibespacedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:vibespace}
    password: ${SPRING_DATASOURCE_PASSWORD:tiger}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    root: INFO
    com.vibespace: DEBUG

